<svg xmlns="http://www.w3.org/2000/svg" width="277.0mm" height="141.00mm" viewBox="0 0 277.0 141.00" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="2.3" markerHeight="2.3" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#6b7280"/></marker></defs><text x="0.00" y="6.20" font-size="4.6" font-weight="600" fill="#1f2937" text-anchor="start">Visa Allocation</text><text x="0.00" y="11.40" font-size="2.7" font-weight="400" fill="#6b7280" text-anchor="start">Fraud (10.x) and authorisation (11.x) disputes · you decide on arbitration, not the issuer</text><clipPath id="frame-3-visa-allocation"><rect x="0" y="15.0" width="277.0" height="117.50000000000001" rx="2.4"/></clipPath><g clip-path="url(#frame-3-visa-allocation)"><rect x="0" y="15.00" width="277.0" height="43.55" fill="#f8f9fb"/><rect x="0" y="15.00" width="21.0" height="43.55" fill="#eef1f4"/><text x="10.50" y="35.98" font-size="2.75" font-weight="600" fill="#1f2937" text-anchor="middle">You &amp;</text><text x="10.50" y="39.55" font-size="2.75" font-weight="600" fill="#1f2937" text-anchor="middle">Checkout</text><rect x="0" y="58.55" width="277.0" height="43.90" fill="#ffffff"/><rect x="0" y="58.55" width="21.0" height="43.90" fill="#eef1f4"/><text x="10.50" y="81.49" font-size="2.75" font-weight="600" fill="#1f2937" text-anchor="middle">Issuer</text><line x1="0" y1="58.55" x2="277.0" y2="58.55" stroke="#dfe3e8" stroke-width="0.3"/><rect x="0" y="102.45" width="277.0" height="30.05" fill="#f8f9fb"/><rect x="0" y="102.45" width="21.0" height="30.05" fill="#eef1f4"/><text x="10.50" y="118.47" font-size="2.75" font-weight="600" fill="#1f2937" text-anchor="middle">Visa</text><line x1="0" y1="102.45" x2="277.0" y2="102.45" stroke="#dfe3e8" stroke-width="0.3"/></g><rect x="0.15" y="15.15" width="276.7" height="117.20" rx="2.4" fill="none" stroke="#d3d8de" stroke-width="0.3"/><line x1="21.0" y1="15.0" x2="21.0" y2="132.5" stroke="#dfe3e8" stroke-width="0.3"/><path d="M73.25,74.30 H74.33 Q75.83,74.30 75.83,72.80 V32.08 Q75.83,30.58 77.33,30.58 H78.40" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M109.75,30.58 H110.83 Q112.33,30.58 112.33,32.08 V72.80 Q112.33,74.30 113.83,74.30 H114.90" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M146.25,74.30 H151.40" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M182.75,74.30 H183.82 Q185.32,74.30 185.32,72.80 V32.08 Q185.32,30.58 186.82,30.58 H187.90" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M219.25,30.58 H220.50 Q222.00,30.58 222.00,32.08 V106.40" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M130.75,85.75 V89.10" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><path d="M203.75,41.85 V45.20" stroke="#6b7280" stroke-width="0.32" fill="none" marker-end="url(#ah)"/><rect x="42.25" y="62.85" width="31.00" height="22.90" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="44.75" y="69.71" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Dispute</text><text x="44.75" y="74.33" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">The issuer raises</text><text x="44.75" y="77.88" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">the dispute</text><circle cx="45.65" cy="62.85" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="45.65" y="63.73" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">1</text><rect x="78.75" y="19.30" width="31.00" height="22.55" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="81.25" y="26.16" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Pre-arbitration</text><text x="81.25" y="30.78" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">We raise it with</text><text x="81.25" y="34.33" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">your evidence</text><circle cx="82.15" cy="19.30" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="82.15" y="20.18" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">2</text><rect x="92.69" y="17.10" width="15.06" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="95.29" cy="19.30" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M95.29,18.63 V19.30 H95.83" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="97.29" y="20.12" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">20 days</text><rect x="115.25" y="62.85" width="31.00" height="22.90" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="117.75" y="69.71" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Issuer review</text><text x="117.75" y="74.33" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">Accepts or rejects</text><text x="117.75" y="77.88" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">our evidence</text><rect x="129.16" y="60.65" width="15.09" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="131.76" cy="62.85" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M131.76,62.18 V62.85 H132.30" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="133.76" y="63.67" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">30 days</text><rect x="115.25" y="89.45" width="31.00" height="9.80" rx="3.20" fill="#f3f4f6" stroke="#c8cdd4" stroke-width="0.25"/><text x="130.75" y="93.12" font-size="2.65" font-weight="400" fill="#1f2937" text-anchor="middle">Accepts → case</text><text x="130.75" y="96.42" font-size="2.65" font-weight="400" fill="#1f2937" text-anchor="middle">closed in your favour</text><rect x="151.75" y="62.85" width="31.00" height="22.90" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="154.25" y="69.71" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Pre-arbitration</text><text x="154.25" y="73.61" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">response</text><text x="154.25" y="78.23" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">The issuer rejects</text><text x="154.25" y="81.78" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">our evidence</text><circle cx="155.15" cy="62.85" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="155.15" y="63.73" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">3</text><rect x="188.25" y="19.30" width="31.00" height="22.55" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="190.75" y="26.16" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Your decision</text><text x="190.75" y="30.78" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">Accept liability or</text><text x="190.75" y="34.33" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">take the case to</text><text x="190.75" y="37.88" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">arbitration</text><circle cx="191.65" cy="19.30" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="191.65" y="20.18" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">4</text><rect x="202.65" y="17.10" width="14.60" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="205.25" cy="19.30" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M205.25,18.63 V19.30 H205.79" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="207.25" y="20.12" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">10 days</text><rect x="188.25" y="45.55" width="31.00" height="9.80" rx="3.20" fill="#f3f4f6" stroke="#c8cdd4" stroke-width="0.25"/><text x="203.75" y="49.22" font-size="2.65" font-weight="400" fill="#1f2937" text-anchor="middle">Accept liability → the</text><text x="203.75" y="52.52" font-size="2.65" font-weight="400" fill="#1f2937" text-anchor="middle">chargeback stands</text><rect x="188.25" y="106.75" width="67.50" height="22.55" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="190.75" y="113.61" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Arbitration</text><text x="190.75" y="118.23" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">We file with Visa. Visa&#x27;s ruling is final, and the</text><text x="190.75" y="121.78" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">losing party pays the fee (typically USD</text><text x="190.75" y="125.33" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">400–800)</text><text x="0.00" y="138.40" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="start">How to read:</text><rect x="19.01" y="135.50" width="7" height="4" fill="#eef1f4" stroke="#dfe3e8" stroke-width="0.25"/><text x="28.01" y="138.40" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Each row shows who has to act</text><circle cx="72.84" cy="137.50" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="72.84" y="138.38" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">1</text><text x="76.89" y="138.40" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Numbered step</text><rect x="100.75" y="135.30" width="14.60" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="103.35" cy="137.50" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M103.35,136.83 V137.50 H103.89" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="105.35" y="138.32" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">10 days</text><text x="117.56" y="138.40" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Time limit for the party in that row</text><rect x="162.63" y="135.50" width="9" height="4" rx="2" fill="#f3f4f6" stroke="#c8cdd4" stroke-width="0.25"/><text x="173.63" y="138.40" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Where the case can end</text></svg>