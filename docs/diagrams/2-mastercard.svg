><text x="63.00" y="26.16" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Second</text><text x="63.00" y="30.06" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">presentment</text><text x="63.00" y="34.68" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">We challenge it</text><text x="63.00" y="38.23" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">with your evidence</text><circle cx="63.90" cy="19.30" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="63.90" y="20.18" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">2</text><rect x="74.44" y="17.10" width="15.06" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="77.04" cy="19.30" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M77.04,18.63 V19.30 H77.58" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="79.04" y="20.12" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">20 days</text><rect x="97.00" y="63.20" width="31.00" height="26.45" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="99.50" y="70.06" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Issuer review</text><text x="99.50" y="74.68" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">Accepts or rejects</text><text x="99.50" y="78.23" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">our evidence</text><rect x="110.91" y="61.00" width="15.09" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="113.51" cy="63.20" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M113.51,62.53 V63.20 H114.05" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="115.51" y="64.02" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">30 days</text><rect x="97.00" y="93.35" 