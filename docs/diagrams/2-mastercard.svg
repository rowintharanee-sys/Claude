ight="19.00" rx="1.6" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.3"/><text x="209.00" y="120.81" font-size="3.15" font-weight="600" fill="#1f2937" text-anchor="start">Arbitration</text><text x="209.00" y="125.43" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">Mastercard&#x27;s ruling is final, and the losing</text><text x="209.00" y="128.98" font-size="2.8" font-weight="400" fill="#4b5563" text-anchor="start">party pays the fee (typically USD 400–800)</text><text x="0.00" y="142.05" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="start">How to read:</text><rect x="19.01" y="139.15" width="7" height="4" fill="#eef1f4" stroke="#dfe3e8" stroke-width="0.25"/><text x="28.01" y="142.05" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Each row shows who has to act</text><circle cx="72.84" cy="141.15" r="2.35" fill="#ffffff" stroke="#1f2937" stroke-width="0.3"/><text x="72.84" y="142.03" font-size="2.45" font-weight="600" fill="#1f2937" text-anchor="middle">1</text><text x="76.89" y="142.05" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Numbered step</text><rect x="100.75" y="138.95" width="14.60" height="4.4" rx="2.2" fill="#ffffff" stroke="#9aa3ae" stroke-width="0.25"/><circle cx="103.35" cy="141.15" r="1.08" fill="none" stroke="#4b5563" stroke-width="0.26"/><path d="M103.35,140.48 V141.15 H103.89" fill="none" stroke="#4b5563" stroke-width="0.26" stroke-linecap="round"/><text x="105.35" y="141.97" font-size="2.3" font-weight="600" fill="#1f2937" text-anchor="start">10 days</text><text x="117.56" y="142.05" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Time limit for the party in that row</text><rect x="162.63" y="139.15" width="9" height="4" rx="2" fill="#f3f4f6" stroke="#c8cdd4" stroke-width="0.25"/><text x="173.63" y="142.05" font-size="2.45" font-weight="400" fill="#4b5563" text-anchor="start">Where the case can end</text></svg>